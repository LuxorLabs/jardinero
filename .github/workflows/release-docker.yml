name: CI release docker images

# On a release tag (v*), runs the full check gate and publishes the orchestrator
# image tagged with the semver version. That image is the deterministic,
# rollback-able artifact a deployment pins to.
#
# Authentication is the GITHUB_TOKEN GitHub already injects, so a fork that wants
# its own images needs no credentials of its own.

on:
  push:
    tags: ["v*"]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Check and publish versioned image
    runs-on: tenki-standard-large-8c-16g
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make install
      - run: make check CHECK_CHANGESET=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get image ref and Node version
        env:
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # A registry ref has to be lowercase, and neither the tag nor the
          # owner/name pair is guaranteed to be.
          IMAGE_TAG=$(echo "$REF_NAME" | tr 'A-Z' 'a-z')
          IMAGE_NAME=$(echo "$REPOSITORY" | tr 'A-Z' 'a-z')
          echo "IMAGE_REF=ghcr.io/${IMAGE_NAME}:${IMAGE_TAG}" | tee -a "$GITHUB_ENV"
          echo "IMAGE_LATEST=ghcr.io/${IMAGE_NAME}:latest" | tee -a "$GITHUB_ENV"
          # On a release the app version is the semver tag itself.
          echo "BUILD_VERSION=${IMAGE_TAG}" | tee -a "$GITHUB_ENV"
          echo "NODE_VERSION=$(cat .nvmrc)-bookworm-slim" | tee -a "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.prod
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            BUILD_VERSION=${{ env.BUILD_VERSION }}
          tags: |
            ${{ env.IMAGE_REF }}
            ${{ env.IMAGE_LATEST }}
          push: true

      - name: Print image info
        run: |
          echo "Released image:"
          echo "- ${{ env.IMAGE_REF }}"
