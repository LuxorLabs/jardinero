name: Build Tenki image

# Drives tenki-images/build.sh from CI, so refreshing an image is an action
# anyone with write access can take rather than one that depends on a laptop
# holding the tenki CLI and the right credentials.
#
# Dispatch only for now. A schedule is the point of the stable tag below, but it
# is worth having watched a few runs before one fires unattended: a failed
# rebuild poisons whatever consumes the tag, and telling that apart from a real
# failure in the consumer is the confusing case.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Recipe name under tenki-images/recipes (without .sh)'
        type: string
        default: default
      tag:
        description: 'Channel tag to publish'
        type: string
        default: smoke
      dated:
        description: 'Append a UTC timestamp, making the tag a new immutable ref'
        type: boolean
        default: false
      codex_version:
        description: 'Codex CLI version to bake; blank bakes latest'
        type: string
        default: ''

# One build per tag at a time: two runs publishing the same ref would race over
# what the tag ends up pointing at.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.repo }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    # The toolchain install happens inside the Tenki sandbox being baked, not
    # here; this runner only drives the CLI.
    runs-on: tenki-standard-small-2c-4g
    timeout-minutes: 60
    # The same credential the smoke uses. Split this into its own environment if
    # publishing to the registry ever wants a narrower key than booting a sandbox.
    environment: tenki-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image is a published product and cannot carry a CLI for one
      # repository's sake, so the build installs its own. The binary it leaves
      # behind runs with a credential in the next step, so the step refuses to
      # hand it on unless it is the exact build pinned below.
      - name: Install the tenki CLI
        env:
          TENKI_VERSION: '1.7.0'
          # The linux/amd64 build at TENKI_VERSION. Pinned here rather than
          # taken from the bucket's .sha256 sidecar, which a swapped artifact
          # would be swapped alongside; it only moves when the version does.
          TENKI_SHA256: '4f353535c543a750c0b32ef74a0a3c7c5c3959130e8648926e685b5bc403b737'
          # A self-hosted runner outlives the job, so the install goes to the
          # job's own temp rather than into a home directory the next job sees.
          TENKI_INSTALL_DIR: ${{ runner.temp }}/tenki-bin
        run: |
          set -euo pipefail
          # Named separately so a digest mismatch always means what it says.
          [ "$(uname -m)" = "x86_64" ] || {
            echo "::error::the pinned digest is the linux/amd64 build; this runner is $(uname -m)"
            exit 1
          }
          installer="$RUNNER_TEMP/tenki-install.sh"
          curl -fsSL https://tenki.cloud/install.sh -o "$installer"
          mkdir -p "$TENKI_INSTALL_DIR"
          bash "$installer" --version "$TENKI_VERSION"
          binary="$TENKI_INSTALL_DIR/tenki"
          [ -x "$binary" ] || {
            echo "::error::install.sh left no tenki in $TENKI_INSTALL_DIR"
            exit 1
          }
          actual="$(sha256sum "$binary" | cut -d' ' -f1)"
          [ "$actual" = "$TENKI_SHA256" ] || {
            echo "::error::tenki $TENKI_VERSION is $actual, not the pinned $TENKI_SHA256"
            exit 1
          }
          echo "tenki $TENKI_VERSION verified: $actual"
          echo "$TENKI_INSTALL_DIR" >> "$GITHUB_PATH"
          # build.sh needs this to read every API response, so a missing jq
          # fails the build several minutes in rather than here.
          command -v jq >/dev/null 2>&1 || {
            echo "::error::jq is required by tenki-images/build.sh and is not on this runner"
            exit 1
          }

      - name: Build and publish
        env:
          TENKI_API_KEY: ${{ secrets.TENKI_API_KEY }}
          REPO: ${{ inputs.repo }}
          TAG: ${{ inputs.tag }}
          DATED: ${{ inputs.dated }}
          CODEX_VERSION: ${{ inputs.codex_version }}
        run: |
          set -euo pipefail
          [ -n "${TENKI_API_KEY:-}" ] || {
            echo "::error::the tenki-smoke environment is missing TENKI_API_KEY"
            exit 1
          }
          # Each value on its own, never concatenated: an empty tag beside a
          # real repo reads as valid together, and the empty `--tag` then eats
          # the next flag as its channel, publishing under `--no-date-<stamp>`.
          for value in "$REPO" "$TAG"; do
            case "$value" in
              '' | *[!a-zA-Z0-9._-]*)
                echo "::error::repo and tag must be non-empty and match [A-Za-z0-9._-]"
                exit 1
                ;;
            esac
          done
          # Empty is meaningful here; it bakes latest.
          case "$CODEX_VERSION" in
            *[!a-zA-Z0-9._-]*)
              echo "::error::codex_version must match [A-Za-z0-9._-]"
              exit 1
              ;;
          esac

          flags="--tag $TAG"
          # A bare channel is overwritten in place, so whatever points at it
          # follows the rebuild without anyone editing a reference.
          [ "$DATED" = "true" ] || flags="$flags --no-date"

          {
            echo "Recipe: \`$REPO\`"
            echo ""
            echo "Tag: \`$TAG\`$([ "$DATED" = "true" ] && echo ' plus a UTC timestamp' || echo ' (overwritten in place)')"
            echo ""
            echo "The published ref is in the build log."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$CODEX_VERSION" ]; then
            make tenki-image REPO="$REPO" FLAGS="$flags" CODEX_VERSION="$CODEX_VERSION"
          else
            make tenki-image REPO="$REPO" FLAGS="$flags"
          fi
