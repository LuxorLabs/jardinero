name: CI publish image

# On a release tag (v*), runs the full check gate and publishes the image tagged
# with the semver version, and as latest. That image is the deterministic,
# rollback-able artifact a deployment pins to.
#
# Run by hand instead to publish the current commit as <date>-<sha>, for a build
# that is not worth a version. It never moves latest, which stays on the newest
# release.
#
# Authentication is the GITHUB_TOKEN GitHub already injects, so a fork that wants
# its own images needs no credentials of its own.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Check and publish image
    runs-on: tenki-standard-large-8c-16g
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # OIDC token for keyless signing; attestations for the provenance record.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make install
      - run: make check CHECK_CHANGESET=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get image tags and Node version
        env:
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          IS_RELEASE: ${{ github.event_name == 'push' }}
        run: |
          # A registry ref has to be lowercase, and neither the tag nor the
          # owner/name pair is guaranteed to be.
          IMAGE_NAME=$(echo "$REPOSITORY" | tr 'A-Z' 'a-z')
          # Every build carries a <date>-<sha> tag, which is the one a deployment
          # can follow: it sorts, and it exists whether or not this was a release.
          STAMP="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          TAGS="ghcr.io/${IMAGE_NAME}:${STAMP}"
          BUILD_VERSION="$STAMP"
          if [ "$IS_RELEASE" = "true" ]; then
            BUILD_VERSION=$(echo "$REF_NAME" | tr 'A-Z' 'a-z')
            TAGS=$(printf '%s\n%s\n%s' "$TAGS" \
              "ghcr.io/${IMAGE_NAME}:${BUILD_VERSION}" \
              "ghcr.io/${IMAGE_NAME}:latest")
          fi
          echo "IMAGE_NAME=ghcr.io/${IMAGE_NAME}" | tee -a "$GITHUB_ENV"
          echo "BUILD_VERSION=${BUILD_VERSION}" | tee -a "$GITHUB_ENV"
          echo "NODE_VERSION=$(cat .nvmrc)-bookworm-slim" | tee -a "$GITHUB_ENV"
          {
            echo "TAGS<<TAGS_EOF"
            echo "$TAGS"
            echo "TAGS_EOF"
          } >> "$GITHUB_ENV"
          echo "$TAGS"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.prod
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            BUILD_VERSION=${{ env.BUILD_VERSION }}
          tags: ${{ env.TAGS }}
          push: true
          # source is what links the package to this repository and gives anyone
          # holding the image a way back to the code it was built from.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.BUILD_VERSION }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Luxor Technology Corporation
          sbom: true

      # Signed with a short-lived certificate issued to this workflow's OIDC
      # identity, so a verifier can require that an image came from this
      # repository and this workflow rather than merely from this org. Nothing
      # holds a signing key.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      # SLSA provenance, verifiable with `gh attestation verify`. Covers the
      # same claim as the signature through a second, independent path.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Print image info
        run: |
          echo "Published:"
          echo "${{ env.TAGS }}"
