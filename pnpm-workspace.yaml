# No `packages:` key: this repo is a single package, and the file exists only
# because pnpm reads its settings from here.

# esbuild is the only dependency allowed to run install scripts; its script links
# the platform binary tsx execs. Vite 8 bundles with rolldown and transforms with
# oxc, both napi, so it no longer needs esbuild at all -- it stays an optional
# peer used only by the deprecated transformWithEsbuild.
allowBuilds:
  esbuild: true
  # @daytona/sdk pulls protobufjs in, whose postinstall only rewrites its own
  # version banner; the SDK works without it, so it stays refused.
  protobufjs: false
